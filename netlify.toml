# Netlify configuration for Family Trivia Battle (Vite + React SPA)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page-app routing: send every path to index.html so deep links
# like /room/1234 work when opened or refreshed directly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
